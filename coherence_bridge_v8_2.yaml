# AXLE/Lexicon/coherence_bridge.yaml
# Version: 8.1
# Author: G6 LLC / Pablo Nogueira Grossi — Newark NJ
# Purpose: Machine-readable cross-domain lexicon mapping physical/mathematical
#          domains to TOGT operator slots (C, K, F, U) with explicit claim levels.
#
# Claim level definitions:
#   empirical         — domain has measured parameters calibrated to physical data;
#                       all five TOGT questions (C,K,F,U,E) answered from the
#                       domain's own mathematics; g_threshold derived from observation.
#   analogical        — structural similarity identified; 3–4 TOGT questions answered;
#                       g_threshold represents a TOGT identification, not a domain result.
#   formally_stated   — theorem is stated in Lean 4 with honest sorry; no physical
#                       calibration needed (pure mathematics); claim is precise and
#                       falsifiable; no zero-sorry proofs exist yet.
#   formally_verified — theorem proven in Lean 4 with zero sorry; currently no rows
#                       qualify (all AXLE v8.2 theorems carry at least one admit).
#
# Schema note: null means "not calibrated / not applicable / not derived from this domain".
# parameter_status explains why a parameter is null.

schema_version: "1.0"
created: "2026-04-06"
axle_version: "8.2"

claim_level_rules:
  empirical:
    description: >
      Domain is a physical system with experimentally measured parameters.
      All five TOGT questions (C compression, K curvature, F fold/transition,
      U attractor, E stability criterion) are answerable from the domain's own
      mathematics or experimental record. g_threshold is derived from observation,
      not imposed by TOGT.
    required_togt_questions_answered: 5
    parameters_required: true

  analogical:
    description: >
      Structural similarity between domain mathematics and TOGT operator chain
      has been identified. Three to four TOGT questions are answered from the
      domain's own results. g_threshold, if present, is a TOGT identification
      (the framework's stability constant mapped onto the domain) rather than
      a domain-internal result. Uncalibrated parameters are null.
    required_togt_questions_answered: "3-4"
    parameters_required: false

  formally_stated:
    description: >
      The claim is stated as a Lean 4 theorem with honest sorry markers.
      The mathematical content is precise and falsifiable. No physical
      calibration is required or claimed. g_threshold is not applicable.
    required_togt_questions_answered: "N/A (pure mathematics)"
    parameters_required: false

  formally_verified:
    description: >
      The claim is proven in Lean 4 with zero sorry. Currently no rows
      in this lexicon qualify; this row documents the target state.
    required_togt_questions_answered: "N/A (pure mathematics)"
    parameters_required: false

translation_engine:
  five_questions:
    C: "What is being compressed or reduced in this domain? (information, energy, phase, curvature)"
    K: "What curvature or metric deformation encodes the compressed structure?"
    F: "What fold/transition/bifurcation marks the stability boundary?"
    U: "What is the unique attractor or fixed point of the forward dynamics?"
    E: "What stability criterion or threshold separates ordered from disordered regimes?"

  claim_level_diagnostic:
    description: >
      To assign a claim level: count how many of the five TOGT questions (C,K,F,U,E)
      are answerable directly from the domain's own mathematics (not by TOGT analogy).
      5 answered → empirical candidate; 3-4 → analogical; fewer → metaphorical (not listed).

domains:

  - id: wigner_crystal
    name: "Wigner crystallization"
    claim_level: empirical
    source: "Ceperley & Alder (1980); Drummond et al. (2004)"
    g_threshold: 33
    g_threshold_source: "rs* ≈ 30–40 (experimental/QMC bracket); centre value 33 ± 5"
    togt_C: "Coulomb compression of electron fluid into lattice"
    togt_K: "Curvature of Wigner-Seitz cell boundary (rs parameterization)"
    togt_F: "First-order crystallization transition at rs*"
    togt_U: "BCC/FCC Wigner lattice (unique low-T attractor)"
    togt_E: "rs* ≈ 30–40 (empirical stability criterion)"
    parameters:
      mu_max: -0.31
      omega:   0.19
      beta:    1.7
    parameter_status: calibrated
    parameter_source: "Drummond et al. 2004 QMC fits"
    notes: >
      The bracket rs* ∈ [30,40] is the strongest empirical anchor for g=33.
      The specific value 33 is the TOGT identification of the centre of this range.
      Whitney A (fold) singularity class confirmed for the transition.

  - id: neural_microtubule
    name: "Neural microtubule coherence"
    claim_level: empirical
    source: "Penrose & Hameroff (1996); Craddock et al. (2017)"
    g_threshold: 33
    g_threshold_source: "13 protofilaments × 8 nm tubulin dimer = 104 nm period;
                          33 × 8 nm = 264 nm minimum coherent segment (geometric)"
    togt_C: "Tubulin dimer conformational compression (GTP→GDP hydrolysis)"
    togt_K: "Helical pitch curvature of 13-protofilament microtubule lattice"
    togt_F: "Quantum decoherence transition (Orch-OR threshold)"
    togt_U: "Phase-locked tubulin oscillation (coherent segment attractor)"
    togt_E: "33 × 8 nm = 264 nm minimum coherent length (geometric criterion)"
    parameters:
      mu_max: null
      omega:   null
      beta:    null
    parameter_status: >
      Geometric g_threshold is calibrated; dynamical parameters (mu_max, omega, beta)
      are not established for this domain. Orch-OR quantitative predictions remain
      experimentally contested.
    notes: >
      The 33-unit criterion is geometric (protofilament × dimer length), not dynamical.
      Claim level is empirical for the geometry; the quantum coherence mechanism
      (Orch-OR) is a hypothesis, not an established result.

  - id: glycolytic_oscillations
    name: "Glycolytic oscillations (Sel'kov / Goldbeter model)"
    claim_level: empirical
    source: "Goldbeter (1996) Biochemical Oscillations and Cellular Rhythms; Sel'kov (1968) Eur. J. Biochem."
    g_threshold: 1.3
    g_threshold_source: >
      Sel'kov model Hopf bifurcation condition: product a*b > 1 at onset.
      Goldbeter (1996) calibrated fits yield a ≈ 1.0, b ≈ 1.3 (dimensionless
      substrate saturation parameter); g_threshold = b* = 1.3 is the domain-
      internal stability boundary, not a TOGT identification.
    togt_C: "Substrate (glucose/fructose-6-phosphate) consumption by PFK compresses available energy currency"
    togt_K: "Curvature of NADH free-energy landscape near the Hopf bifurcation point"
    togt_F: "Hopf bifurcation at a*b = 1: transition from steady state to limit cycle"
    togt_U: "Stable limit cycle oscillation (~5 min period) — unique periodic attractor in oscillatory regime"
    togt_E: "Sel'kov stability criterion a*b > 1; b* ≈ 1.3 from Goldbeter fits"
    parameters:
      mu_max: 0.42
      omega:   0.06
      beta:    1.3
    parameter_status: calibrated
    parameter_source: >
      mu_max = 0.42: maximal normalised NADH amplitude in sustained oscillatory
      regime (Goldbeter 1996, Table 2.1).
      omega = 0.06 rad/s: oscillation frequency ~0.01 Hz = 2π × 0.01 ≈ 0.063
      rad/s (Goldbeter 1996; yeast glycolytic data Bier et al. 2000).
      beta = 1.3: Sel'kov saturation parameter at Hopf onset (Goldbeter 1996).
    falsifiability_condition: >
      Sustained NADH oscillations in permeabilised yeast at ~5 min period with
      NADH amplitude growing as (b − b*)^0.5 near b* = 1.3.
      Iodoacetate inhibition of PFK must abolish oscillations.
      Period and amplitude must match Goldbeter (1996) Table 2.1 within 15%.
    notes: >
      Canonical biochemical oscillator. Hopf bifurcation is analytically
      proven in the Sel'kov model and numerically confirmed in the full
      Goldbeter model. Replaces phyllotaxis as the primary biological
      empirical anchor in AXLE v8.2.

  - id: gpcr_signaling
    name: "GPCR signaling dynamics (Ca²⁺ / cAMP oscillations)"
    claim_level: empirical
    source: >
      Bhalla & Iyengar (1999) Science 283:381; Goldbeter et al. (1990)
      PNAS 87:1461; Dupont & Goldbeter (1993) Biophys. J. 67:2190
    g_threshold: 0.65
    g_threshold_source: >
      Ca²⁺ oscillation onset threshold: stimulus amplitude S* at which
      the system crosses the Hopf bifurcation into the oscillatory regime.
      Goldbeter et al. (1990) give S* ≈ 0.65 µM IP3 (normalised to 1.0 at
      saturation) for the minimal three-variable Ca²⁺ model. Domain-internal
      result, not a TOGT identification.
    togt_C: "Ligand-receptor binding compresses extracellular signal to intracellular second messenger (IP3/cAMP)"
    togt_K: "Curvature of Ca²⁺ / cAMP free-energy landscape set by SERCA pump vs. IP3R release balance"
    togt_F: "Hopf bifurcation at S*: transition from steady-state Ca²⁺ to spiking oscillations"
    togt_U: "Periodic Ca²⁺ spike train (limit cycle) — unique attractor in oscillatory regime; encodes signal frequency"
    togt_E: "IP3 threshold S* ≈ 0.65 µM (normalised); below this, Ca²⁺ is clamped at resting level"
    parameters:
      mu_max: 0.85
      omega:   0.11
      beta:    0.55
    parameter_status: calibrated
    parameter_source: >
      mu_max = 0.85: peak normalised cytosolic Ca²⁺ amplitude at saturating IP3
      (Dupont & Goldbeter 1993, Fig. 3; Goldbeter et al. 1990 Fig. 2).
      omega = 0.11 rad/s: Ca²⁺ oscillation frequency ~0.017 Hz (period ~60 s)
      from Goldbeter et al. (1990) hepatocyte data; 2π × 0.017 ≈ 0.11 rad/s.
      beta = 0.55: SERCA pump damping coefficient from Dupont & Goldbeter (1993)
      three-variable model fit (dimensionless ratio of pump to leak rate).
    falsifiability_condition: >
      Ca²⁺ oscillation period must scale as (S − S*)^{-0.5} near the Hopf point
      S* ≈ 0.65 µM IP3 in HeLa or hepatocyte cells.
      Thapsigargin (SERCA inhibitor) must abolish oscillations and raise
      baseline Ca²⁺, confirming the pump-leak balance encoded in beta.
      Frequency encoding: doubling agonist concentration must increase spike
      frequency, not amplitude (consistent with omega parameterisation).
    notes: >
      GPCR → IP3 → Ca²⁺ cascade is the most-studied oscillatory signalling
      system in cell biology. Parameters are from the Goldbeter minimal model,
      which has been validated against dozens of cell types. Provides the
      molecular-scale empirical anchor for AXLE v8.2's biological tier,
      complementing glycolytic oscillations at the metabolic scale.

  - id: galactic_spiral_density_waves
    name: "Galactic spiral density waves (Lin-Shu theory)"
    claim_level: empirical
    source: >
      Lin & Shu (1964) ApJ 140:646; Binney & Tremaine (2008)
      Galactic Dynamics 2nd ed. §6.2; Dobbs & Baba (2014) PASA 31:35
    g_threshold: 2.0
    g_threshold_source: >
      Toomre Q parameter: Q = σ_R κ / (3.36 G Σ) — the disk stability criterion.
      Q < 1 → axisymmetric instability; Q ≈ 1–2 → spiral wave amplification
      (swing amplification regime). Observed spiral galaxies cluster at Q ≈ 1.5–2.5;
      g_threshold = Q* = 2.0 is the upper boundary of the swing-amplification
      window, calibrated from Milky Way and M51 observations (Dobbs & Baba 2014
      Table 1). Domain-internal result from galactic kinematics, not a TOGT ID.
    togt_C: "Stellar density compression along spiral arms: gas clouds compressed by factor ~3–5 at arm passage"
    togt_K: "Pitch angle curvature of logarithmic spiral pattern (i ≈ 15–25° for grand-design spirals)"
    togt_F: "Corotation resonance: fold where pattern speed Ω_p equals stellar orbital frequency; separates inner/outer disk dynamics"
    togt_U: "Grand-design two-arm spiral pattern (m=2 mode) — dominant attractor in Q ≈ 1.5–2 regime"
    togt_E: "Toomre Q* ≈ 2.0 stability boundary; below Q* swing amplification maintains spiral; above Q* disk is stable"
    parameters:
      mu_max: 0.30
      omega:   0.22
      beta:    1.5
    parameter_status: calibrated
    parameter_source: >
      mu_max = 0.30: fractional density contrast of spiral arm over inter-arm
      region; ~20–40% contrast observed in NIR surveys of grand-design spirals
      (Rix & Zaritsky 1995 ApJ 447:82); central value 0.30.
      omega = 0.22 rad/Gyr⁻¹ (normalised to disk orbital frequency Ω_0 = 1):
      pattern speed Ω_p / Ω_0 ≈ 0.22 from Milky Way bar/spiral pattern speed
      measurements (Portail et al. 2017 MNRAS 465:1621; normalised units).
      beta = 1.5: pitch angle decay exponent from logarithmic spiral fit;
      i = i_0 × exp(−beta × t / t_dyn) from N-body simulations of transient
      spiral arms (Dobbs & Baba 2014 §4.2; dimensionless).
    falsifiability_condition: >
      Pitch angle of grand-design spirals must be stable (i ≈ 15–25°) in
      galaxies with Q ∈ [1.5, 2.5] and must increase (arms wind up) when
      Q > Q* = 2.0 (no swing amplification).
      Pattern speed must satisfy Ω_p < Ω_0 (pattern slower than disk stars)
      at corotation radius R_CR identified by Tremaine-Weinberg method.
      m=2 Fourier mode must dominate in NIR (tracing old stellar mass, not
      just star-forming gas) for claim of quasi-stationary density wave.
    notes: >
      Lin-Shu density wave theory provides a 60-year-old empirical framework
      with quantitative predictions confirmed in dozens of galaxies. The Toomre
      Q parameter is a domain-internal stability threshold with no reference to
      TOGT. Provides the galactic-scale empirical anchor for AXLE v8.2,
      completing the three-scale empirical triad: molecular (GPCR) →
      metabolic (glycolytic) → galactic (spiral waves).

  - id: phyllotaxis
    name: "Plant phyllotaxis (Fibonacci spirals)"
    claim_level: analogical
    source: "Douady & Couder (1992); Mitchison (1977)"
    g_threshold: null
    g_threshold_source: >
      Phyllotactic indices are 8 and 13 (consecutive Fibonacci numbers), not 33.
      No g_threshold = 33 is derived from phyllotaxis. TOGT stability range g=8–13
      is a softer identification; this field is left null to avoid false precision.
    togt_C: "Primordium inhibition field (compression of growth signal)"
    togt_K: "Cylindrical curvature of stem meristem"
    togt_F: "Bifurcation at golden angle 137.507° (transition to spiral packing)"
    togt_U: "Fibonacci spiral lattice (unique stable packing attractor)"
    togt_E: "Golden angle criterion; Fibonacci indices 8,13 (not 33)"
    parameters:
      mu_max: null
      omega:   null
      beta:    null
    parameter_status: >
      Phyllotaxis does not calibrate to the (mu_max, omega, beta) parameterization.
      Dynamical parameters are null. Golden angle and Fibonacci structure are
      well-established but map to g ∈ {8,13}, not 33.
    notes: >
      Strongest evidence for TOGT's Fibonacci/golden-ratio thread.
      The g=33 identification is not supported by phyllotaxis data.
      Downgraded from empirical to analogical in v8.2: dynamical parameters
      (mu_max, omega, beta) are not calibrated, and g_threshold is null.
      The structural analogy (compression → curvature → golden-angle fold →
      Fibonacci attractor) is genuine; the domain is not parameter-clean.

  - id: collatz
