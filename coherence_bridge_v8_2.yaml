    source: "AXLE v8.2 DiscreteDm3.lean v1.5 — CollatzDm3Candidate"
    g_threshold: null
    g_threshold_source: "Not applicable: pure combinatorial problem; no stability threshold."
    togt_C: "Halving map n → n/2 (compression of even integers)"
    togt_K: "GQM metric deformation: weight(k) = η^{-k} on PhaseVector"
    togt_F: "3n+1 step (fold: odd branch creates curvature in orbit)"
    togt_U: "4 → 2 → 1 cycle (conjectured unique global attractor)"
    togt_E: "Conjecture: every orbit reaches 1; no finite g threshold known"
    parameters:
      mu_max: null
      omega:   null
      beta:    null
    parameter_status: >
      Pure mathematical conjecture. Physical parameterization not applicable.
      The (mu_max, omega, beta) slots are structural parameters for physical
      domains; they have no meaning here.
    lean4_sorry_label: "ADMIT-D, ADMIT-E, ADMIT-F"
    lean4_sorry_count: 3
    axle_status: "DiscreteDm3.lean v1.5 — CollatzDm3Candidate"
    notes: >
      dm³_disc v1.5 proves operatorDecomposition (TOGT grammar) and contactForm
      with zero sorry. The remaining analytic axioms — meanContraction,
      lyapunovDescent, and hasStructuredCycle — are open (ADMIT-D, ADMIT-E,
      ADMIT-F). Collatz is now a concrete object in DiscreteDm3Category with
      two structural theorems fully verified. The lean4_theorem field is omitted
      because the claim is distributed across multiple theorems in the candidate
      structure rather than a single named theorem.

  - id: bsd
    name: "Birch and Swinnerton-Dyer conjecture"
    claim_level: analogical
    source: "Birch & Swinnerton-Dyer (1965); Wiles et al. (partial results)"
    g_threshold: null
    g_threshold_source: >
      No g_threshold is derived from BSD. The conjecture concerns the rank of
